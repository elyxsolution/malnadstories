<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malnad Stories — Album Loader</title>
<!--
  MALNAD STORIES · Premium album loading micro-interaction
  Pure HTML + CSS · transparent background · infinite loop · GPU-accelerated transforms.

  React / Next.js integration
  ───────────────────────────
  1. Copy the .malnad-album-loader <div> below into a component's return (rename class→className).
  2. Copy the CSS between the "LOADER STYLES" markers into a .css / .module.css file and import it.
     (All selectors and @keyframes are prefixed `mal-` so nothing collides.)
  3. Drop <MalnadAlbumLoader /> anywhere. Size it by wrapping in a box and scaling, e.g.
     <div style={{ transform: 'scale(0.85)' }}><MalnadAlbumLoader/></div>, or edit
     `.malnad-album-loader { width / height }`. Honors prefers-reduced-motion.
-->
<style>
  /* --- standalone preview shell only (delete when embedding) --- */
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: grid; place-items: center; min-height: 100vh; }

  /* ================= LOADER STYLES · START ================= */
  .malnad-album-loader { position: relative; width: 180px; height: 180px; }
  .malnad-album-loader * { box-sizing: border-box; }

  /* soft ground shadow — stays on the floor while the album floats */
  .mal-shadow {
    position: absolute; left: 50%; top: 150px; width: 140px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.18), rgba(0,0,0,0));
    filter: blur(3px);
    animation: mal-shadow 6.5s ease-in-out infinite;
  }

  /* the floating open album */
  .mal-album {
    position: absolute; left: 50%; top: 50%; width: 166px; height: 128px;
    margin-left: -83px; margin-top: -64px;
    animation: mal-float 6.5s ease-in-out infinite;
  }

  /* rich brown leather hardcover */
  .mal-cover {
    position: absolute; inset: 0; border-radius: 11px;
    background: linear-gradient(140deg, #74563f 0%, #67492f 55%, #5c4028 100%);
    box-shadow: 0 12px 24px -6px rgba(0,0,0,.30), 0 3px 8px rgba(0,0,0,.16),
                inset 0 1px 1px rgba(255,255,255,.08), inset 0 0 0 1px rgba(0,0,0,.10);
  }
  /* debossed inner frame with a faint gold hairline */
  .mal-frame {
    position: absolute; inset: 5px; border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.20), inset 0 0 0 2px rgba(203,174,122,.12);
  }

  /* warm cream two-page spread */
  .mal-pages { position: absolute; inset: 8px; display: flex; gap: 4px; }
  .mal-page {
    flex: 1;
    background: linear-gradient(90deg, #FAF7F2 68%, #efeae0 100%);
    box-shadow: inset -7px 0 9px -7px rgba(0,0,0,.22);
  }
  .mal-page--l { border-radius: 3px 1px 1px 3px; }
  .mal-page--r {
    border-radius: 1px 3px 3px 1px;
    background: linear-gradient(270deg, #FAF7F2 68%, #efeae0 100%);
    box-shadow: inset 7px 0 9px -7px rgba(0,0,0,.22);
  }

  /* photographs live in a shared 3D context */
  .mal-photos { position: absolute; inset: 8px; perspective: 800px; transform-style: preserve-3d; }

  /* one card = BACK face first, FRONT face last (front wins at rest; z-depth + backface-visibility drive the flip) */
  .mal-photo { position: absolute; border-radius: 2px; transform-style: preserve-3d; }
  .mal-face {
    position: absolute; inset: 0; border-radius: 2px; overflow: hidden;
    backface-visibility: hidden;
  }
  .mal-front { transform: translateZ(1px); background: #fff; }               /* white photo border */
  .mal-back  {
    transform: rotateY(180deg) translateZ(1px); background: #FAF7F2;
    box-shadow: inset 0 0 0 1px rgba(107,79,58,.10);
  }
  .mal-horizon { position: absolute; top: 46%; height: 3px; border-radius: 2px; background: #e7ddca; }
  .mal-scene { position: absolute; border-radius: 1px; }

  /* polaroid vs borderless print framing */
  .mal-photo--polaroid .mal-scene   { top: 3px; left: 3px; right: 3px; bottom: 8px; }
  .mal-photo--polaroid .mal-horizon { left: 25%; right: 25%; }
  .mal-photo--print .mal-scene      { inset: 2.5px; }
  .mal-photo--print .mal-horizon    { left: 28%; right: 28%; }

  /* blurred landscape placeholders — soft light band + tonal gradient, no people */
  .mal-scene--green { background: linear-gradient(180deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.18) 34%, rgba(255,255,255,0) 48%), linear-gradient(170deg, #c2d6cd 0%, #8fb79f 36%, #5c9377 64%, #3f7860 100%); }
  .mal-scene--gold  { background: linear-gradient(180deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.18) 34%, rgba(255,255,255,0) 48%), linear-gradient(170deg, #f3dca6 0%, #e6ad60 44%, #cf8f4a 73%, #ae7238 100%); }
  .mal-scene--teal  { background: linear-gradient(180deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.18) 34%, rgba(255,255,255,0) 48%), linear-gradient(170deg, #c4dad9 0%, #8fb6b4 38%, #5e8f8c 68%, #40726f 100%); }
  .mal-scene--earth { background: linear-gradient(180deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.18) 34%, rgba(255,255,255,0) 48%), linear-gradient(170deg, #eccaa6 0%, #d1926b 45%, #b0704e 73%, #8f5636 100%); }
  .mal-scene--blue  { background: linear-gradient(180deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.18) 34%, rgba(255,255,255,0) 48%), linear-gradient(170deg, #c3d2e2 0%, #8da8c6 40%, #6285a6 70%, #476a89 100%); }

  /* per-photo placement + shuffle timeline (staggered so only 1–2 move at once) */
  .mal-p1 { left: 26px; top: 14px; width: 32px; height: 40px; animation: mal-shuf1 6s infinite; }
  .mal-p2 { left: 22px; top: 60px; width: 44px; height: 32px; animation: mal-shuf2 6s infinite; }
  .mal-p3 { left: 59px; top: 36px; width: 32px; height: 40px; animation: mal-shuf3 6s infinite; }
  .mal-p4 { left: 86px; top: 18px; width: 44px; height: 32px; animation: mal-shuf4 6s infinite; }
  .mal-p5 { left: 94px; top: 58px; width: 32px; height: 40px; animation: mal-shuf5 6s infinite; }

  @keyframes mal-float {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50%      { transform: translate3d(0, -4px, 0) rotate(-0.6deg); }
  }
  @keyframes mal-shadow {
    0%, 100% { transform: translate3d(-50%, 0, 0) scale(1);    opacity: .5; }
    50%      { transform: translate3d(-50%, 0, 0) scale(1.12); opacity: .33; }
  }
  @keyframes mal-shuf1 {
    0%, 6%   { transform: translate3d(0,0,0) rotate(-6deg) scale(1);          box-shadow: 0 1px 2px rgba(0,0,0,.14); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    11%      { transform: translate3d(0,-7px,0) rotate(-6deg) scale(1.09);    box-shadow: 0 9px 16px -4px rgba(0,0,0,.20); animation-timing-function: cubic-bezier(.34,1.2,.64,1); }
    17%      { transform: translate3d(16px,6px,0) rotate(3deg) scale(1.06);   animation-timing-function: cubic-bezier(.34,1.1,.64,1); }
    24%      { transform: translate3d(9px,-4px,0) rotate(-10deg) scale(1.05); box-shadow: 0 8px 14px -4px rgba(0,0,0,.18); animation-timing-function: cubic-bezier(.22,1.3,.36,1); }
    30%,100% { transform: translate3d(0,0,0) rotate(-6deg) scale(1);          box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  }
  @keyframes mal-shuf2 {
    0%, 14%  { transform: translate3d(0,0,0) rotate(5deg) rotateY(0deg) scale(1);            box-shadow: 0 1px 2px rgba(0,0,0,.14); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    19%      { transform: translate3d(0,-8px,0) rotate(5deg) rotateY(0deg) scale(1.10);      box-shadow: 0 9px 16px -4px rgba(0,0,0,.20); animation-timing-function: cubic-bezier(.34,1.1,.64,1); }
    26%      { transform: translate3d(-10px,-6px,0) rotate(-2deg) rotateY(180deg) scale(1.06); animation-timing-function: cubic-bezier(.34,1.05,.64,1); }
    33%      { transform: translate3d(6px,4px,0) rotate(10deg) rotateY(360deg) scale(1.05);  box-shadow: 0 8px 14px -4px rgba(0,0,0,.18); animation-timing-function: cubic-bezier(.22,1.3,.36,1); }
    40%,100% { transform: translate3d(0,0,0) rotate(5deg) rotateY(360deg) scale(1);          box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  }
  @keyframes mal-shuf3 {
    0%, 30%  { transform: translate3d(0,0,0) rotate(-3deg) rotateY(0deg) scale(1);            box-shadow: 0 1px 2px rgba(0,0,0,.14); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    36%      { transform: translate3d(0,-9px,0) rotate(-3deg) rotateY(0deg) scale(1.12);      box-shadow: 0 11px 18px -4px rgba(0,0,0,.22); animation-timing-function: cubic-bezier(.34,1.1,.64,1); }
    44%      { transform: translate3d(-8px,6px,0) rotate(6deg) rotateY(180deg) scale(1.07);   animation-timing-function: cubic-bezier(.34,1.05,.64,1); }
    51%      { transform: translate3d(7px,-5px,0) rotate(-8deg) rotateY(360deg) scale(1.06);  box-shadow: 0 8px 14px -4px rgba(0,0,0,.18); animation-timing-function: cubic-bezier(.22,1.3,.36,1); }
    58%,100% { transform: translate3d(0,0,0) rotate(-3deg) rotateY(360deg) scale(1);          box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  }
  @keyframes mal-shuf4 {
    0%, 44%  { transform: translate3d(0,0,0) rotate(6deg) scale(1);           box-shadow: 0 1px 2px rgba(0,0,0,.14); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    49%      { transform: translate3d(0,-7px,0) rotate(6deg) scale(1.09);     box-shadow: 0 9px 16px -4px rgba(0,0,0,.20); animation-timing-function: cubic-bezier(.34,1.15,.64,1); }
    56%      { transform: translate3d(-14px,7px,0) rotate(-2deg) scale(1.06); animation-timing-function: cubic-bezier(.34,1.05,.64,1); }
    63%      { transform: translate3d(-6px,-5px,0) rotate(12deg) scale(1.05); box-shadow: 0 8px 14px -4px rgba(0,0,0,.18); animation-timing-function: cubic-bezier(.22,1.3,.36,1); }
    70%,100% { transform: translate3d(0,0,0) rotate(6deg) scale(1);           box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  }
  @keyframes mal-shuf5 {
    0%, 58%  { transform: translate3d(0,0,0) rotate(-5deg) scale(1);          box-shadow: 0 1px 2px rgba(0,0,0,.14); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    63%      { transform: translate3d(0,-8px,0) rotate(-5deg) scale(1.10);    box-shadow: 0 9px 16px -4px rgba(0,0,0,.20); animation-timing-function: cubic-bezier(.34,1.15,.64,1); }
    70%      { transform: translate3d(-16px,-6px,0) rotate(4deg) scale(1.06); animation-timing-function: cubic-bezier(.34,1.05,.64,1); }
    78%      { transform: translate3d(-7px,4px,0) rotate(-12deg) scale(1.05); box-shadow: 0 8px 14px -4px rgba(0,0,0,.18); animation-timing-function: cubic-bezier(.22,1.3,.36,1); }
    86%,100% { transform: translate3d(0,0,0) rotate(-5deg) scale(1);          box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mal-album, .mal-shadow, .mal-photo { animation: none !important; }
  }
  /* ================= LOADER STYLES · END ================= */
</style>
</head>
<body>

  <div class="malnad-album-loader" role="status" aria-label="Preparing your album">
    <div class="mal-shadow"></div>
    <div class="mal-album">
      <div class="mal-cover"></div>
      <div class="mal-frame"></div>
      <div class="mal-pages">
        <div class="mal-page mal-page--l"></div>
        <div class="mal-page mal-page--r"></div>
      </div>
      <div class="mal-photos">
        <div class="mal-photo mal-photo--polaroid mal-p1">
          <div class="mal-face mal-back"><div class="mal-horizon"></div></div>
          <div class="mal-face mal-front"><div class="mal-scene mal-scene--green"></div></div>
        </div>
        <div class="mal-photo mal-photo--print mal-p2">
          <div class="mal-face mal-back"><div class="mal-horizon"></div></div>
          <div class="mal-face mal-front"><div class="mal-scene mal-scene--gold"></div></div>
        </div>
        <div class="mal-photo mal-photo--polaroid mal-p3">
          <div class="mal-face mal-back"><div class="mal-horizon"></div></div>
          <div class="mal-face mal-front"><div class="mal-scene mal-scene--teal"></div></div>
        </div>
        <div class="mal-photo mal-photo--print mal-p4">
          <div class="mal-face mal-back"><div class="mal-horizon"></div></div>
          <div class="mal-face mal-front"><div class="mal-scene mal-scene--earth"></div></div>
        </div>
        <div class="mal-photo mal-photo--polaroid mal-p5">
          <div class="mal-face mal-back"><div class="mal-horizon"></div></div>
          <div class="mal-face mal-front"><div class="mal-scene mal-scene--blue"></div></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
