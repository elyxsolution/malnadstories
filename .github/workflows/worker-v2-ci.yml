name: Worker V2 CI

# Continuous verification for the Worker V2 foundation workspace (worker/).
# Runs the same gates the Engineering Playbook requires before merge (§11, §12):
# typecheck · architectural boundaries · lint · format · tests.

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-v2-ci.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-v2-ci.yml'

defaults:
  run:
    working-directory: worker

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architectural boundaries
        run: pnpm run boundaries

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Test
        run: pnpm run test
